
<html>
<head>
	<!-- Estilos e Scripts do Fluig Style Guide e jQuery -->
	<link type="text/css" rel="stylesheet" href="/style-guide/css/fluig-style-guide-flat.min.css"/>
	<script type="text/javascript" src="/portal/resources/js/jquery/jquery.js"></script>
	<script type="text/javascript" src="/portal/resources/js/jquery/jquery-ui.min.js"></script>
	<script type="text/javascript" src="/portal/resources/js/mustache/mustache-min.js"></script>
	<script type="text/javascript" src="/style-guide/js/fluig-style-guide.min.js" charset="utf-8"></script>
</head>
<body>
<div class="fluig-style-guide">
<form name="form" role="form">

	<!-- ========================================== -->
	<!-- PAINEL: REQUISITANTE                       -->
	<!-- ========================================== -->
	<div class="panel panel-primary">
		<div class="panel-heading">
			<h3 class="panel-title"><i class="animaliaicon animaliaicon-user icon-md" aria-hidden="true"></i> Requisitante</h3>
		</div>
		<div class="panel-body">
			<!-- Linha 1: Nome, Email, Telefone -->
			<div class="row">
				<div class="form-group col-md-6">
					<label for="nome">Nome</label>
					<input type="text" name="nome" id="nome" class="form-control">
				</div>
				<div class="form-group col-md-4">
					<label for="email">Email</label>
					<input type="email" name="email" id="email" class="form-control">
				</div>
				<div class="form-group col-md-2">
					<label for="telefone">Telefone</label>
					<input type="text" name="telefone" id="telefone" class="form-control">
				</div>
			</div>
			<!-- Linha 2: Data de Nascimento e Documento de Identidade -->
			<div class="row">
				<div class="form-group col-md-2">
					<label for="dataNascimento">Data de nascimento</label>
					<input type="text" name="dataNascimento" id="dataNascimento" class="form-control">
				</div>
				<div class="form-group col-md-2">
					<label for="DocumentoIdentidade">Documento de identidade</label>
					<input type="text" name="DocumentoIdentidade" id="DocumentoIdentidade" class="form-control">
				</div>
			</div>
		</div>
	</div>
	
	<!-- ========================================== -->
	<!-- PAINEL: PONTO COMERCIAL                    -->
	<!-- ========================================== -->
	<div class="panel panel-primary">
		<div class="panel-heading">
			<h3 class="panel-title"><i class="animaliaicon animaliaicon-map-pin icon-md" aria-hidden="true"></i> Ponto Comercial</h3>
		</div>
		<div class="panel-body">
			<!-- Linha 1: Responsável, Tipo do Ponto e Dias de Funcionamento -->
			<div class="row">
				<div class="form-group col-md-6">
					<label>Responsável</label>
				</div>	    
				<div class="form-group col-md-2">
					<label for="tipoPonto">Tipo do Ponto</label>
					<div class="radio">
						<label><input type="radio" name="tipoPonto" id="tipoPonto" value="quiosque">Quiosque</label>
						<label><input type="radio" name="tipoPonto" id="tipoPonto" value="loja">Loja</label>
					</div>
				</div>
				<div class="form-group col-md-4">
					<label>Dias de funcionamento</label>
					<div class="checkbox">
						<label><input type="checkbox" name="domingo">Dom</label>
						<label><input type="checkbox" name="segunda">Seg</label>
						<label><input type="checkbox" name="terca">Ter</label>
						<label><input type="checkbox" name="quarta">Qua</label>
						<label><input type="checkbox" name="quinta">Qui</label>
						<label><input type="checkbox" name="sexta">Sex</label>
						<label><input type="checkbox" name="sabado">Sab</label>
					</div>
				</div>
			</div>
			<!-- Linha 2: Endereço (CEP, Logradouro, Número, Bairro, Cidade, Estado) -->
			<div class="row">
				<div class="form-group col-md-3">
					<label for="cep">CEP</label>
					<input type="text" name="cep" id="cep" class="form-control" mask="00000-000">
				</div>
				<div class="form-group col-md-3">
					<label for="logradouro">Logradouro</label>
					<input type="text" name="logradouro" id="logradouro" class="form-control">
				</div>
				<div class="form-group col-md-1">
					<label for="numero">Numero</label>
					<input type="text" name="numero" id="numero" class="form-control">
				</div>
				<div class="form-group col-md-3">
					<label for="bairro">Bairro</label>
					<input type="text" name="bairro" id="bairro" class="form-control">
				</div>
				<div class="form-group col-md-2">
					<label for="cidade">Cidade</label>
					<input type="text" name="cidade" id="cidade" class="form-control">
				</div>
				<div class="form-group col-md-2">
					<label for="estado">Estado</label>
					<input type="text" name="estado" id="estado" class="form-control">
				</div>
			</div>
			<!-- Linha 3: Informações Adicionais -->
			<div class="row">
				<div class="form-group col-md-12">
					<label for="informacoes">Informações adicionais</label>
					<textarea rows="5" name="informacoes" id="informacoes" class="form-control"></textarea>
				</div>
			</div>
		</div>
	</div>

	<!-- ========================================== -->
	<!-- PAINEL: RESPONSÁVEIS (TABELA PAI/FILHO)    -->
	<!-- ========================================== -->
	<div class="panel panel-primary">
		<div class="panel-heading">
			<h3 class="panel-title"><i class="animaliaicon animaliaicon-users-three icon-md" aria-hidden="true"></i> Responsaveis</h3>
		</div>
		<div class="panel-body">
			<table tablename="responsaveisTabela" class="table table-hover" addbuttonlabel="Adicionar Responsável" addbuttonclass="btn btn-info">
				<thead>
					<tr>
						<td>Responsáveis</td>
					</tr>
				</thead>
				<tbody>
					<tr>
						<td>
							<!-- Campo Zoom do Fluig integrado na tabela -->
							<input
								type="zoom"
								id="responsavel"
								name="responsavel"
								data-zoom="{
									'displayKey': 'colleagueName',
									'datasetId': 'colleague',
									'maximumSelectionLength': '2',
									'placeholder': 'Escolha o usuário',
									'fields': [
										{
											'field': 'colleagueId',
											'label': 'ID'
										},
										{
											'field': 'colleagueName',
											'label': 'Nome',
											'standard': 'true'
										},
										{
											'field': 'login',
											'label': 'Login'
										}
									]
								}"
							/>
						</td>
					</tr>
				</tbody>
			</table>
			<div class="row"></div>
		</div>
	</div>

	<!-- ========================================== -->
	<!-- PAINEL: FINANCEIRO                         -->
	<!-- ========================================== -->
	<div class="panel panel-primary">
		<div class="panel-heading">
			<h3 class="panel-title"><i class="animaliaicon animaliaicon-money-wavy icon-md" aria-hidden="true"></i> Financeiro</h3>
		</div>
		<div class="panel-body">
			<div class="row">
				<div class="form-group col-md-2">
					<label for="valor">Valor</label>
					<input type="number" name="valor" id="valor" class="form-control">
				</div>
			</div>
		</div>
	</div>

</form>
</div>
</body>
<!-- Scripts Externos e Inicialização de Componentes -->
<script type="text/javascript" src="cep.js"></script>
<script type="text/javascript">
	// Inicializa o calendário do Fluig para o campo de data de nascimento
	var calendarioDataNascimento = FLUIGC.calendar('#dataNascimento');
</script>
</html>
